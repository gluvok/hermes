name: Build Edge Frontend

on:
  push:
    branches:
      - main
      - release
    paths:
      - 'src/web/frontend/**'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    paths:
      - 'src/web/frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

jobs:
  build:
    name: Next.js Frontend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Type Check & Build
        run: pnpm build
